name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      # Every matrix job asserts the same pinned golden trace hash, so
      # "byte-identical traces across Node versions" (SPEC §10.1) is an
      # enforced fact, not a claim.
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      # pnpm/setup is the successor to pnpm/action-setup for pnpm 11+.
      # It reads the pnpm version from packageManager in package.json,
      # installs node, and caches the pnpm store.
      - uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          runtime: node@${{ matrix.node }}
          cache: true
          install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm --filter @nemea/studio build
